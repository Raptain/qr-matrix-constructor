services:
  - type: web
    name: qr-matrix-constructor
    runtime: python
    repo: https://github.com/Raptain/qr-matrix-constructor
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8